<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prototypes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prototypes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050505">
<link rel="apple-touch-icon" href="icon.png?v=3">
<style>
:root{--bg:#050505;--text:#fff;--text-2:#ffffffcc;--text-3:#ffffff73;--card:#161616;--line:#ffffff1f;--sans:Inter,-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 16px/24px var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#list{min-height:100%;padding:calc(env(safe-area-inset-top) + 64px) 16px calc(env(safe-area-inset-bottom) + 32px)}
h1{font-size:34px;line-height:40px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--text-3);font-size:14px;line-height:20px;margin:0 0 28px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:16px;padding:16px;margin:0 0 12px;color:inherit;font:inherit;cursor:pointer}
.card:active{opacity:.7}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.t{font-size:17px;line-height:24px;font-weight:600}
.n{color:var(--text-2);font-size:14px;line-height:20px;margin-top:2px}
.d{color:var(--text-3);font-size:12px;line-height:16px;margin-top:10px}
.new{flex:none;font-size:11px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:#fff;color:#000;border-radius:6px;padding:2px 8px}
.empty{color:var(--text-3);padding:24px 0}
#viewer{position:fixed;inset:0;background:#000;display:none}
#viewer iframe{position:absolute;left:0;right:0;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);width:100%;height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));border:0;background:#000}

.app{background:#0f0f0f;border:1px solid var(--line);margin-top:20px}
.app .t{font-size:15px}
#wrap{position:fixed;inset:0;display:none;z-index:5}
#bd{position:absolute;inset:0;background:#000a}
#sheet{position:absolute;left:0;right:0;bottom:0;background:#161616;border-radius:24px 24px 0 0;padding:12px 16px calc(env(safe-area-inset-bottom) + 16px);animation:up .28s cubic-bezier(.32,.72,0,1) both}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:36px;height:4px;border-radius:2px;background:#ffffff40;margin:0 auto 14px}
.act{display:block;width:100%;height:52px;border:0;border-radius:14px;background:#2a2a2a;color:#fff;font:600 16px/24px var(--sans);margin-top:8px;cursor:pointer}
.act.primary{background:#fff;color:#000}.act.ghost{background:transparent;color:var(--text-3);font-weight:400}
.act:active{opacity:.7}
.hint{color:var(--text-3);font-size:12px;line-height:18px;margin:12px 4px 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);z-index:9;background:#fff;color:#000;border-radius:12px;padding:10px 16px;font-size:14px;line-height:20px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86%;text-align:center}
.card{position:relative}
.dotnew{position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;background:#34c759}
.card .t{padding-right:24px}
.st{position:absolute;right:12px;bottom:14px;display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--text-3)}
.st.ok{color:var(--text-3)}
.st.bad{color:#ff453a}
</style></head><body>
<div id="list"><h1 id="h">Prototypes</h1><p class="sub" id="sub"></p><div id="cards"></div></div>
<div id="viewer"><iframe id="frame" title="Prototype" allow="clipboard-write; fullscreen"></iframe></div>
<div id="wrap"><div id="bd"></div><div id="sheet"><div class="grab"></div><div class="t" id="st"></div><div class="n" id="sn"></div>
<button class="act primary" id="aOpen">Open</button><button class="act" id="aCopy">Copy link</button><a class="act" id="aSafari" target="_blank" rel="noopener" style="text-decoration:none;line-height:52px;text-align:center">Open in Safari</a>
<p class="hint">To review it in the Origin Demo app: copy the link, hold the Dev badge in the app, and paste it into Web app url. To keep one on its own icon: open it in Safari, then Share, then Add to Home Screen.</p>
<button class="act ghost" id="aCancel">Cancel</button></div></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const group=new URLSearchParams(location.search).get('for')||'everyone';
const SEEN='seen:'+group;
let seen={};try{seen=JSON.parse(localStorage.getItem(SEEN)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(SEEN,JSON.stringify(seen))}catch(e){}};
const fmt=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}catch(e){return d}};
// A prototype takes over the whole page, the way it does in Safari, so it is a first-party site and can
// remember your sign-in. (An item with "mode":"frame" shows inside this page instead.)
function open(it){seen[it.id]=1;save();
  if(it.mode==='frame'){$('frame').src=it.url;$('viewer').style.display='block';$('list').style.display='none';return}
  location.href=it.url}

let cur=null;
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.opacity=0,2600)}
function closeSheet(){$('wrap').style.display='none'}
function copy(text){
  const done=()=>toast('Link copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>fallback())}else fallback();
  function fallback(){const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.focus();a.select();try{document.execCommand('copy');done()}catch(e){toast('Could not copy. Press and hold the link instead.')}a.remove()}
}
function sheet(it){cur=it;$('aSafari').href=it.url;$('st').textContent=it.title;$('sn').textContent=it.note||'';$('wrap').style.display='block'}
$('bd').onclick=closeSheet;$('aCancel').onclick=closeSheet;
$('aOpen').onclick=()=>{closeSheet();open(cur)};
$('aCopy').onclick=()=>{copy(cur.url);closeSheet()};
$('aSafari').onclick=()=>{seen[cur.id]=1;save();setTimeout(closeSheet,300)};
let data=null;
function render(){
  if(!data)return;const g=(data.groups||{})[group]||(data.groups||{}).everyone||{title:'Prototypes',items:[]};
  $('h').textContent=g.title||'Prototypes';
  const items=(g.items||[]).slice().sort((a,b)=>(b.added||'').localeCompare(a.added||''));
  const n=items.filter(i=>!seen[i.id]).length;
  $('sub').textContent=items.length?(n?n+' new':'Everything is up to date'):'';
  const c=$('cards');c.innerHTML='';
  if(!items.length){c.innerHTML='<div class="empty">Nothing here yet. New prototypes will appear on this screen.</div>'}
  for(const it of items){const b=document.createElement('button');b.className='card';
    b.innerHTML=(seen[it.id]?'':'<i class="dotnew" title="New"></i>')+'<div class="row"><div class="t"></div></div><div class="n"></div><div class="d"></div><div class="st" data-u=""><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg><span></span></div>';b.querySelector('.st').dataset.u=it.url;
    b.querySelector('.t').textContent=it.title;b.querySelector('.n').textContent=it.note||'';b.querySelector('.d').textContent='Added '+fmt(it.added);
    b.onclick=()=>sheet(it);c.appendChild(b)}
  const ap=data.app;if(ap&&ap.url){const a=document.createElement('a');a.className='card app';a.href=ap.url;a.style.textDecoration='none';a.innerHTML='<div class="t"></div><div class="n"></div>';a.querySelector('.t').textContent=ap.title||'Origin Demo app';a.querySelector('.n').textContent=ap.note||'';c.appendChild(a)}
}

// Is each link up? A dead preview no longer resolves, so a failed request means broken.
async function ping(u){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
  try{await fetch(u,{mode:'no-cors',cache:'no-store',signal:c.signal});return true}catch(e){return false}finally{clearTimeout(t)}}
let srv={};
async function check(){try{srv=(await (await fetch('status.json?'+Date.now())).json()).links||{}}catch(e){srv={}}
  document.querySelectorAll('.st').forEach(async el=>{
  const s=srv[el.dataset.u],ok=(await ping(el.dataset.u))&&(!s||s.ok);el.className='st '+(ok?'ok':'bad');el.lastChild.textContent=ok?'':'Broken'})}
const load=()=>fetch('links.json?'+Date.now()).then(r=>r.json()).then(j=>{data=j;render();check()}).catch(()=>{$('sub').textContent='Could not load the list. Check your connection.'});
load();setInterval(()=>{if(!document.hidden&&$('viewer').style.display!=='block')check()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('viewer').style.display!=='block')load()});
</script></body></html>
