name: Check links
on:
  schedule: [{cron: '*/5 * * * *'}]
  workflow_dispatch:
  push: {branches: [main], paths: [links.json]}
permissions: {contents: write}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
      - run: |
          git config user.name "link-checker"; git config user.email "noreply@github.com"
          git add status.json; git diff --cached --quiet || (git commit -m "Update link status" && git push)
